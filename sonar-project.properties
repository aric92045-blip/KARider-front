# Configuración de SonarQube Cloud para KARider-front (Vue 3 + TypeScript).
sonar.organization=aric92045-blip
sonar.projectKey=aric92045-blip_KARider-front
sonar.projectName=KARider-front

# Código fuente y pruebas (las pruebas se analizan como pruebas, no se ocultan).
# Se analiza todo el código mantenido por el equipo: la PWA (src), el servidor de la SPA
# en Azure (deploy) y los workflows de GitHub Actions (.github).
sonar.sources=src,deploy,.github
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**,src/**/*.spec.ts
sonar.exclusions=src/**/__tests__/**,src/**/*.spec.ts

# Cobertura generada por `npm run test:coverage` (Vitest + V8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
